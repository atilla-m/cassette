name: Draft Linux prerelease

on:
  push:
    tags:
      - "v0.1.0-beta.1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: 0.1.0-beta.1
  UPDATE_FEED_URL: https://atilla-m.github.io/cassette/updates/beta/latest.json

jobs:
  preflight:
    name: Validate tagged Linux release commit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag, commit, version, license, and updater metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          project_version="$(node -p "require('./package.json').version")"
          test "$project_version" = "$RELEASE_VERSION"
          test "$GITHUB_REF_NAME" = "v$project_version"

          test "$(node -p "require('./package-lock.json').version")" = "$project_version"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "$project_version"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$project_version"
          grep -Fqx "version = \"$project_version\"" src-tauri/Cargo.toml
          grep -Fqx 'license = "GPL-3.0-or-later"' src-tauri/Cargo.toml
          test "$(node -p "require('./package.json').license")" = "GPL-3.0-or-later"
          test "$(node -p "require('./src-tauri/tauri.conf.json').bundle.license")" = "GPL-3.0-or-later"

          node <<'NODE'
          const config = require('./src-tauri/tauri.conf.json');
          const updater = config.plugins?.updater;
          const expectedEndpoint = process.env.UPDATE_FEED_URL;
          if (!updater || typeof updater.pubkey !== 'string' || updater.pubkey.trim().length < 32) {
            throw new Error('A real updater public key must be committed before creating the release tag.');
          }
          if (/placeholder|replace|todo|example/i.test(updater.pubkey)) {
            throw new Error('The updater public key looks like a placeholder.');
          }
          if (!Array.isArray(updater.endpoints) || updater.endpoints.length !== 1 || updater.endpoints[0] !== expectedEndpoint) {
            throw new Error(`Updater endpoints must contain only ${expectedEndpoint}.`);
          }
          if (updater.dangerousInsecureTransportProtocol || updater.dangerousAcceptInvalidCerts || updater.dangerousAcceptInvalidHostnames) {
            throw new Error('Dangerous updater transport options must remain disabled.');
          }

          const updaterBuild = require('./src-tauri/tauri.updater.conf.json');
          if (updaterBuild.bundle?.createUpdaterArtifacts !== true) {
            throw new Error('The signed release overlay must enable createUpdaterArtifacts.');
          }
          const signedScript = require('./package.json').scripts?.['release:linux:signed'] || '';
          if (!signedScript.includes('--features signed-updater') || !signedScript.includes('tauri.updater.conf.json')) {
            throw new Error('The signed Linux build must enable the updater plugin and signed artifact overlay.');
          }
          NODE
          node --input-type=module -e "import { validateUpdaterConfiguration, readReleaseConfiguration } from './scripts/release-policy.mjs'; validateUpdaterConfiguration(readReleaseConfiguration('.'));"

  build-linux:
    name: Build signed Linux x86_64 artifacts
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Confirm build uses tagged commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Refresh apt metadata and install libunwind
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libunwind-dev

      - name: Install Linux build and packaging dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            cpio \
            file \
            libarchive-tools \
            libayatana-appindicator3-dev \
            libdiscid-dev \
            libfuse2 \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            p7zip-full \
            pkg-config \
            rpm \
            squashfs-tools \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly
          patchelf --version

      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:updater
      - run: python3 scripts/test-signature-safety.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build signed Linux release bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          npm run release:linux:signed

      - name: Verify Linux release artifacts and updater signature
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit-release-artifacts.py \
            --workspace . \
            --version "$RELEASE_VERSION" \
            --license LICENSE \
            --frontend build \
            --artifact src-tauri/target/release/cassette \
            --artifact src-tauri/target/release/bundle/deb/Cassette_0.1.0-beta.1_amd64.deb \
            --artifact src-tauri/target/release/bundle/rpm/Cassette-0.1.0-beta.1-1.x86_64.rpm \
            --artifact src-tauri/target/release/bundle/appimage/Cassette_0.1.0-beta.1_amd64.AppImage \
            --artifact src-tauri/target/release/bundle/appimage/Cassette_0.1.0-beta.1_amd64.AppImage.sig
          node scripts/verify-update.mjs \
            src-tauri/target/release/bundle/appimage/Cassette_0.1.0-beta.1_amd64.AppImage \
            src-tauri/target/release/bundle/appimage/Cassette_0.1.0-beta.1_amd64.AppImage.sig "$RELEASE_VERSION"

      - name: Upload exact Linux workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cassette-0.1.0-beta.1-linux-x86_64-signed
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/Cassette_0.1.0-beta.1_amd64.deb
            src-tauri/target/release/bundle/rpm/Cassette-0.1.0-beta.1-1.x86_64.rpm
            src-tauri/target/release/bundle/appimage/Cassette_0.1.0-beta.1_amd64.AppImage
            src-tauri/target/release/bundle/appimage/Cassette_0.1.0-beta.1_amd64.AppImage.sig

  draft-release:
    name: Create Linux-only draft prerelease
    needs: [preflight, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cassette-0.1.0-beta.1-linux-x86_64-signed
          path: release-assets/linux

      - name: Verify exact selected assets
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/linux/Cassette_0.1.0-beta.1_amd64.deb
          test -f release-assets/linux/Cassette-0.1.0-beta.1-1.x86_64.rpm
          test -f release-assets/linux/Cassette_0.1.0-beta.1_amd64.AppImage
          test -s release-assets/linux/Cassette_0.1.0-beta.1_amd64.AppImage.sig
          test "$(find release-assets -type f | wc -l)" -eq 4
          sha256sum \
            release-assets/linux/Cassette_0.1.0-beta.1_amd64.deb \
            release-assets/linux/Cassette-0.1.0-beta.1-1.x86_64.rpm \
            release-assets/linux/Cassette_0.1.0-beta.1_amd64.AppImage \
            release-assets/linux/Cassette_0.1.0-beta.1_amd64.AppImage.sig

      - name: Create draft prerelease and upload exact Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          test "$tag" = "v$RELEASE_VERSION"

          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh api "repos/${GH_REPO}/releases/tags/${tag}" --jq '.draft')"
            is_prerelease="$(gh api "repos/${GH_REPO}/releases/tags/${tag}" --jq '.prerelease')"
            test "$is_draft" = "true"
            test "$is_prerelease" = "true"

            while IFS= read -r asset; do
              case "$asset" in
                Cassette_0.1.0-beta.1_amd64.deb|Cassette-0.1.0-beta.1-1.x86_64.rpm|Cassette_0.1.0-beta.1_amd64.AppImage|Cassette_0.1.0-beta.1_amd64.AppImage.sig) ;;
                *) echo "Refusing to reuse draft with unexpected asset: $asset" >&2; exit 1 ;;
              esac
            done < <(gh api "repos/${GH_REPO}/releases/tags/${tag}" --jq '.assets[].name')
          else
            gh release create "$tag" \
              --draft \
              --prerelease \
              --verify-tag \
              --title "Cassette ${tag#v}" \
              --notes "Draft Linux prerelease. Complete docs/RELEASING.md before publishing."
          fi

          gh release upload "$tag" \
            release-assets/linux/Cassette_0.1.0-beta.1_amd64.deb \
            release-assets/linux/Cassette-0.1.0-beta.1-1.x86_64.rpm \
            release-assets/linux/Cassette_0.1.0-beta.1_amd64.AppImage \
            release-assets/linux/Cassette_0.1.0-beta.1_amd64.AppImage.sig \
            --clobber

          actual_assets="$(gh api "repos/${GH_REPO}/releases/tags/${tag}" --jq '.assets[].name' | sort)"
          expected_assets="$(printf '%s\n' \
            Cassette-0.1.0-beta.1-1.x86_64.rpm \
            Cassette_0.1.0-beta.1_amd64.AppImage \
            Cassette_0.1.0-beta.1_amd64.AppImage.sig \
            Cassette_0.1.0-beta.1_amd64.deb | sort)"
          test "$actual_assets" = "$expected_assets"
