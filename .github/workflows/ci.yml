name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: 0.1.0-beta.10

jobs:
  linux:
    name: Linux x86_64 (Ubuntu 22.04)
    if: "!startsWith(github.ref, 'refs/tags/windows-v')"
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Refresh apt metadata and install libunwind
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libunwind-dev

      - name: Install Linux build and packaging dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            cpio \
            file \
            libarchive-tools \
            libayatana-appindicator3-dev \
            libdiscid-dev \
            libfuse2 \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            p7zip-full \
            pkg-config \
            rpm \
            squashfs-tools \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly
          patchelf --version

      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:stats
      - run: npm run test:lyrics
      - run: npm run test:updater
      - run: python3 scripts/test-windows-runtime-audit.py
      - run: python3 scripts/test-signature-safety.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build current-version Linux release bundles
        run: npm run release:linux

      - name: Verify Linux packages and scan release artifacts
        run: |
          python scripts/audit-release-artifacts.py \
            --workspace . \
            --version "$RELEASE_VERSION" \
            --license LICENSE \
            --frontend build \
            --artifact src-tauri/target/release/cassette \
            --artifact src-tauri/target/release/bundle/deb/Cassette_0.1.0-beta.10_amd64.deb \
            --artifact src-tauri/target/release/bundle/rpm/Cassette-0.1.0-beta.10-1.x86_64.rpm

      - name: Upload exact Linux CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cassette-0.1.0-beta.10-linux-package-validation
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/Cassette_0.1.0-beta.10_amd64.deb
            src-tauri/target/release/bundle/rpm/Cassette-0.1.0-beta.10-1.x86_64.rpm

  windows:
    name: Windows x86_64 (Windows Server 2022)
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Windows release version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Use non-personal Rust tool directories
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:SystemDrive "cassette-build-tools"
          $cargoHome = Join-Path $toolRoot "cargo"
          $rustupHome = Join-Path $toolRoot "rustup"
          New-Item -ItemType Directory -Force -Path $cargoHome, $rustupHome | Out-Null
          "CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTUP_HOME=$rustupHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Install and verify official GStreamer MSVC x86_64
        shell: pwsh
        run: ./scripts/install-gstreamer-windows.ps1

      - name: Verify required GStreamer runtime elements
        shell: pwsh
        run: |
          $elements = @(
            "playbin", "uridecodebin", "decodebin3", "filesrc", "typefind",
            "audioconvert", "audioresample", "autoaudiosink",
            "flacdec", "flacenc", "oggdemux", "vorbisdec", "opusdec", "wavparse", "qtdemux"
          )
          foreach ($element in $elements) {
            & gst-inspect-1.0.exe $element *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Required GStreamer element is unavailable: $element"
            }
          }

          $mp3Available = @("mpg123audiodec", "avdec_mp3") | Where-Object {
            & gst-inspect-1.0.exe $_ *> $null
            $LASTEXITCODE -eq 0
          }
          if (-not $mp3Available) { throw "No supported MP3 decoder is installed." }

          $aacAvailable = @("faad", "avdec_aac") | Where-Object {
            & gst-inspect-1.0.exe $_ *> $null
            $LASTEXITCODE -eq 0
          }
          if (-not $aacAvailable) { throw "No supported AAC decoder is installed." }

      - name: Stage verified private Windows GStreamer runtime
        shell: pwsh
        run: ./scripts/stage-gstreamer-windows.ps1

      - name: Test private runtime without system GStreamer on PATH
        shell: pwsh
        run: ./scripts/test-bundled-gstreamer-windows.ps1

      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:stats
      - run: npm run test:lyrics
      - run: npm run test:updater
      - run: python scripts/test-windows-runtime-audit.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Verify Windows update signatures with a disposable key
        if: "!startsWith(github.ref, 'refs/tags/windows-v')"
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "cassette-update-fixture"
          New-Item -Path $fixture -ItemType Directory | Out-Null
          $key = Join-Path $fixture "fixture.key"
          $config = Join-Path $fixture "tauri.conf.json"
          $installer = Join-Path $fixture "Cassette_${env:RELEASE_VERSION}_x64-setup.exe"
          $password = [guid]::NewGuid().ToString()
          node node_modules/@tauri-apps/cli/tauri.js signer generate --ci -w $key -p $password | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not create disposable updater key." }
          Set-Content -LiteralPath $installer -Value "synthetic Windows updater payload"
          node node_modules/@tauri-apps/cli/tauri.js signer sign -f $key -p $password $installer | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not sign Windows updater fixture." }
          @{ plugins = @{ updater = @{ pubkey = (Get-Content -LiteralPath "$key.pub" -Raw).Trim() } } } |
            ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $config -Encoding utf8
          cargo run --locked --quiet --manifest-path scripts/update-verifier/Cargo.toml -- $installer "$installer.sig" $config $env:RELEASE_VERSION --windows
          if ($LASTEXITCODE -ne 0) { throw "Valid Windows signature was rejected." }
          Add-Content -LiteralPath $installer -Value "altered"
          cargo run --locked --quiet --manifest-path scripts/update-verifier/Cargo.toml -- $installer "$installer.sig" $config $env:RELEASE_VERSION --windows
          if ($LASTEXITCODE -eq 0) { throw "An altered Windows update passed signature verification." }
          exit 0

      - name: Build current-version NSIS bundle
        if: "!startsWith(github.ref, 'refs/tags/windows-v')"
        run: npm run release:windows

      - name: Build and sign the Windows beta update
        if: startsWith(github.ref, 'refs/tags/windows-v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run release:windows:signed

      - name: Verify and scan Windows release artifacts
        shell: pwsh
        run: |
          python scripts/audit-release-artifacts.py `
            --workspace . `
            --version $env:RELEASE_VERSION `
            --windows-beta `
            --license LICENSE `
            --frontend build `
            --artifact src-tauri/target/x86_64-pc-windows-msvc/release/cassette.exe `
            --artifact "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Cassette_${env:RELEASE_VERSION}_x64-setup.exe"

      - name: Install and smoke-test without build-machine GStreamer
        shell: pwsh
        run: ./scripts/test-installed-windows-runtime.ps1

      - name: Upload exact Windows CI artifacts
        if: "!startsWith(github.ref, 'refs/tags/windows-v')"
        uses: actions/upload-artifact@v4
        with:
          name: cassette-${{ env.RELEASE_VERSION }}-windows-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Cassette_${{ env.RELEASE_VERSION }}_x64-setup.exe

      - name: Verify the signed update and prepare its manifest
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: |
          $directory = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $name = "Cassette_${env:RELEASE_VERSION}_x64-setup.exe"
          $installer = Join-Path $directory $name
          $signature = "$installer.sig"
          cargo run --locked --quiet --manifest-path scripts/update-verifier/Cargo.toml -- $installer $signature src-tauri/tauri.conf.json $env:RELEASE_VERSION --windows
          if ($LASTEXITCODE -ne 0) { throw "Windows update signature verification failed." }
          $manifest = @{
            version = $env:RELEASE_VERSION
            platforms = @{
              "windows-x86_64" = @{
                url = "https://github.com/atilla-m/cassette/releases/download/$env:GITHUB_REF_NAME/$name"
                signature = (Get-Content -LiteralPath $signature -Raw).Trim()
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath "$directory/windows-update.json" -Encoding utf8

      - name: Upload verified Windows update assets
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-update
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Cassette_${{ env.RELEASE_VERSION }}_x64-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Cassette_${{ env.RELEASE_VERSION }}_x64-setup.exe.sig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/windows-update.json

  windows-release-draft:
    name: Stage the signed Windows beta release
    if: startsWith(github.ref, 'refs/tags/windows-v') && github.repository == 'atilla-m/cassette'
    needs: windows
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-update
          path: windows-update
      - name: Create a draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" windows-update/* \
            --verify-tag --draft --prerelease --latest=false \
            --title "Cassette ${GITHUB_REF_NAME#windows-v} for Windows" --generate-notes
